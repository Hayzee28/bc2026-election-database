name: Update Elections BC candidates

on:
  schedule:
    # Preserve the existing hourly source check.
    - cron: "17 * * * *"
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elections-bc-candidate-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install parser dependency
        run: pip install -r requirements.txt

      - name: Run investigation tests
        run: python -m unittest discover -s tests -q

      - name: Fetch, parse, and validate Elections BC register
        run: python scripts/update_candidates.py

      - name: Verify public JSON and CSV agree
        run: python scripts/validate_public_files.py

      - name: Analyze source snapshots
        run: |
          python scripts/investigate_candidates.py
          python scripts/validate_investigation.py

      - name: Publish only real data or source changes
        shell: bash
        run: |
          git add data.json bc-2026-candidates.csv candidate-change-history.json candidate-source-state.json \
            source-history.json source-snapshots candidate-timelines.json local-ebc-mismatches.json jurisdiction-churn.json \
            candidate-anomalies.json candidate-anomaly-report.json reports/latest-candidate-anomalies.md
          if git diff --cached --quiet; then
            echo "No candidate/source change. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Elections BC candidate data and source analysis"
          git push
